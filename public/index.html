<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>経費承認シミュレータ</title>
<style>
  :root { color-scheme: light; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans JP", sans-serif;
    margin: 0; padding: 32px; background: #f6f7f9; color: #1a1d21;
  }
  main { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 24px; }
  .card { background: #fff; border: 1px solid #e3e6ea; border-radius: 10px; padding: 20px; margin-bottom: 16px; }
  label { display: block; font-size: 13px; color: #5b636c; margin-bottom: 6px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  input, select { width: 100%; padding: 8px 10px; border: 1px solid #ccd2d8; border-radius: 6px; font-size: 14px; box-sizing: border-box; }
  .checks { display: flex; gap: 20px; font-size: 14px; }
  .checks label { display: flex; align-items: center; gap: 6px; margin: 0; font-size: 14px; color: #1a1d21; }
  .checks input { width: auto; }
  .result-label { font-size: 12px; color: #5b636c; text-transform: uppercase; letter-spacing: .04em; }
  .steps { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 20px; }
  .step { background: #eef2ff; color: #3538cd; border: 1px solid #c7d2fe; border-radius: 999px; padding: 4px 12px; font-size: 13px; }
  .step.none { background: #f1f3f5; color: #6b7280; border-color: #e0e3e7; }
  .amounts { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .amount-value { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 4px; }
</style>
</head>
<body>
<main>
  <h1>経費承認シミュレータ</h1>

  <div class="card">
    <div class="row">
      <div>
        <label for="amount">申請金額（円）</label>
        <input id="amount" type="number" value="100000" min="0" step="1" />
      </div>
      <div>
        <label for="category">費目</label>
        <select id="category">
          <option value="travel">旅費交通費</option>
          <option value="entertainment">交際費</option>
          <option value="supplies" selected>消耗品費</option>
          <option value="other">その他</option>
        </select>
      </div>
    </div>
    <div class="row">
      <div>
        <label for="grade">申請者の役職</label>
        <select id="grade">
          <option value="staff" selected>担当</option>
          <option value="manager">課長</option>
          <option value="director">部長</option>
        </select>
      </div>
      <div>
        <label>区分</label>
        <div class="checks">
          <label><input id="receipt" type="checkbox" checked /> 領収書あり</label>
          <label><input id="foreign" type="checkbox" /> 国外取引</label>
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="result-label">必要な承認ステップ</div>
    <div class="steps" id="steps"></div>
    <div class="amounts">
      <div>
        <div class="result-label">申請金額</div>
        <div class="amount-value" id="out-amount"></div>
      </div>
      <div>
        <div class="result-label">仕入控除税額</div>
        <div class="amount-value" id="out-tax"></div>
      </div>
    </div>
  </div>
</main>

<script type="module">
import { evaluate } from '../src/rules.mjs';

const LABELS = {
  manager: '課長承認',
  director: '部長承認',
  compliance: 'コンプライアンス承認',
  accounting: '経理確認',
  executive: '役員承認',
};

const el = (id) => document.getElementById(id);

function formatYen(value) {
  // SPEC 4.: 1 円単位・3 桁区切り。丸め表示は禁止。
  return '¥' + value.toLocaleString('ja-JP');
}

function render() {
  const request = {
    amount: Number(el('amount').value || 0),
    category: el('category').value,
    applicantGrade: el('grade').value,
    hasReceipt: el('receipt').checked,
    isForeign: el('foreign').checked,
  };

  const { approvers, deductibleTax } = evaluate(request);

  const steps = el('steps');
  steps.innerHTML = '';
  if (approvers.length === 0) {
    const span = document.createElement('span');
    span.className = 'step none';
    span.textContent = '承認不要';
    steps.append(span);
  } else {
    for (const role of approvers) {
      const span = document.createElement('span');
      span.className = 'step';
      span.textContent = LABELS[role];
      steps.append(span);
    }
  }

  el('out-amount').textContent = formatYen(request.amount);
  el('out-tax').textContent = formatYen(deductibleTax);
}

for (const id of ['amount', 'category', 'grade', 'receipt', 'foreign']) {
  el(id).addEventListener('input', render);
  el(id).addEventListener('change', render);
}
render();
</script>
</body>
</html>
