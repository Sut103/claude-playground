version = "0.1.0"
description = "AI エージェントと人間が共有する Markdown ベースのタスク管理 CLI"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
